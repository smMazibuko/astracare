name: Astracare CI and Windows Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DASTRACARE_BUILD_UI=OFF -DASTRACARE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
  windows-release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtcharts'
          cache: true

      - name: Configure Windows UI build
        run: cmake -S . -B build -A x64 -DASTRACARE_BUILD_UI=ON -DASTRACARE_BUILD_TESTS=ON

      - name: Build application and tests
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build --config Release --output-on-failure

      - name: Package Windows application
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE 'astracare-windows'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'build/ui/Release/astracare.exe' $package
          Copy-Item 'resources' (Join-Path $package 'resources') -Recurse
          windeployqt --release --no-translations --compiler-runtime (Join-Path $package 'astracare.exe')
          Compress-Archive -Path "$package/*" -DestinationPath 'astracare-windows.zip' -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: astracare-windows-${{ github.sha }}
          path: astracare-windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: astracare-windows.zip
